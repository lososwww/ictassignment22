<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Investly — платформа для стартапов и инвесторов</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#fff;--ink:#09090b;--mu:#6b7280;--ln:#e4e4e7;--bd:#f4f4f5;--bl:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#09090b;--ink:#fafafa;--mu:#a1a1aa;--ln:#27272a;--bd:#18181b}}
:root[data-theme=dark]{--bg:#09090b;--ink:#fafafa;--mu:#a1a1aa;--ln:#27272a;--bd:#18181b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
.w{max-width:1040px;margin:auto;padding:0 20px}.c{text-align:center}.mu{color:var(--mu)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--ln)}
nav .w{display:flex;align-items:center;gap:20px;height:56px}
.lg{font-weight:700;font-size:17px;letter-spacing:-.03em;display:flex;gap:8px;align-items:center}
.lg:before{content:"";width:18px;height:18px;border-radius:5px;background:var(--bl)}
nav .m{display:flex;gap:20px;font-size:14px;color:var(--mu);margin-left:auto}
nav .r{display:flex;gap:8px;margin-left:auto;align-items:center;font-size:14px}
.btn{display:inline-block;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;font-size:14px;cursor:pointer}
.btn.p{background:var(--bl);border-color:var(--bl);color:#fff}.btn.d{background:#09090b;border-color:#09090b;color:#fff}
.pill,.st{display:inline-block;border:1px solid var(--ln);background:var(--bd);border-radius:99px;padding:2px 12px;font-size:12px;color:var(--mu)}
h1{font-size:clamp(32px,6vw,56px);letter-spacing:-.04em;line-height:1.05;font-weight:700}
h2{font-size:clamp(24px,4vw,36px);letter-spacing:-.035em;line-height:1.15;font-weight:700}
h3{letter-spacing:-.02em}
.card{border:1px solid var(--ln);border-radius:12px;padding:18px;background:var(--bg);display:block}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.band{background:var(--bd);padding:56px 0}.sec{padding:64px 20px}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
input,select,textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:500;border:0}.tbl{overflow-x:auto}
.cab{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:28px 20px}
.side a{display:block;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--mu)}.side a.on{background:var(--bd);color:var(--ink);font-weight:600}
.pg{display:grid;grid-template-columns:1fr 320px;gap:32px}
.vid{border-radius:12px;min-height:220px;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;display:grid;place-items:center;text-align:center;padding:24px;font-weight:600;font-size:18px}
@media(max-width:760px){.cab,.pg{grid-template-columns:1fr}nav .m{display:none}}
.mod{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}.mod .card{max-width:400px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#09090b;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}
</style></head><body><nav id="nv"></nav><main id="app"></main><div id="md"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='Investly_v1',CAT=['Экотех','Финтех','Агротех','Образование','Здравоохранение','Другое'],ST={new:'Новая',ok:'Принята',no:'Отклонена'};
const money=n=>'$'+Number(n).toLocaleString('ru-RU'),me=()=>D.users.find(u=>u.id==D.me),pct=p=>Math.min(100,Math.round(p.r/p.g*100)||0);
function seed(){const n=Date.now(),v=k=>Array.from({length:k},()=>Math.floor(n-Math.random()*6.9*864e5));
return{users:[],me:null,reqs:[],projects:[
{id:'p1',own:'x',t:'EcoSolve Water Purification',c:'Экотех',s:'Недорогая фильтрация воды на солнечной энергии для удалённых сёл.',pr:'2 млрд человек не имеют доступа к безопасной питьевой воде. Традиционные системы сложны, энергоёмки и недоступны в сельской местности.',so:'Пассивные фильтры на солнечной энергии из местных материалов удаляют 99,9% бактерий и тяжёлых металлов.',g:250000,r:162500,vd:'',tm:[['Алекс Чен','CEO'],['Мария Гарсия','Ведущий инженер'],['Джон Смит','Работа с сообществом']],v:v(214)},
{id:'p2',own:'x',t:'AeroGrow',c:'Агротех',s:'Вертикальные фермы для круглогодичного выращивания зелени в городе.',pr:'Города зависят от импортной свежей продукции, которая дорожает и теряет качество в дороге.',so:'Компактные аэропонные модули выращивают зелень рядом с покупателем с экономией воды до 90%.',g:150000,r:45000,vd:'',tm:[['Айдар Нуров','CEO'],['Дана Ким','Агроном']],v:v(96)},
{id:'p3',own:'x',t:'Finlet',c:'Финтех',s:'Учёт и кредитный скоринг для малого бизнеса по данным онлайн-касс.',pr:'Малый бизнес получает отказы в кредитах из-за отсутствия прозрачной финансовой истории.',so:'Сервис собирает данные касс и банков в единый профиль и передаёт его кредиторам с согласия владельца.',g:400000,r:60000,vd:'',tm:[['Тимур Ахметов','CEO'],['Алия Сеитова','CTO']],v:v(58)}]}}
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
const days=ts=>{const a=Array(7).fill(0),e=new Date().setHours(23,59,59,999);ts.forEach(t=>{const i=6-Math.floor((e-t)/864e5);if(i>=0&&i<7)a[i]++});return a};
function line(a){const W=560,H=150,m=Math.max(...a,1),l=a.map((v,i)=>[i*W/6,H-8-v/m*(H-24)]).map(x=>x.join(',')).join(' ');
const d=Array.from({length:7},(_,i)=>new Date(Date.now()-(6-i)*864e5).toLocaleDateString('ru-RU',{weekday:'short'}));
return`<svg viewBox="0 0 ${W} ${H}" width="100%"><polygon points="0,${H} ${l} ${W},${H}" fill="var(--bl)" opacity=".12"/><polyline points="${l}" fill="none" stroke="var(--bl)" stroke-width="2.5"/></svg><div class="mu" style="display:flex;justify-content:space-between;font-size:12px">${d.map(x=>`<span>${x}</span>`).join('')}</div>`}
const donut=p=>`<svg viewBox="0 0 140 140" width="140"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--bd)" stroke-width="14"/><circle cx="70" cy="70" r="52" fill="none" stroke="var(--bl)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${p*3.27} 400" transform="rotate(-90 70 70)"/><text x="70" y="77" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">${p}%</text></svg>`;
const tile=(a,b)=>`<div class="card"><small class="mu">${a}</small><div style="font-size:26px;font-weight:700;letter-spacing:-.03em">${b}</div></div>`;
const card=p=>`<a class="card" href="#/p/${p.id}"><span class="pill">${E(p.c)}</span><h3 style="margin:10px 0 4px">${E(p.t)}</h3><p class="mu" style="font-size:14px;min-height:42px">${E(p.s)}</p><div class="bar" style="margin:14px 0 6px"><i style="width:${pct(p)}%"></i></div><small class="mu">${money(p.r)} из ${money(p.g)}, ${pct(p)}%</small></a>`;
const V={};
V.home=()=>`<section class="w c" style="padding:72px 20px 40px"><span class="pill">Сделано в Казахстане</span><h1 style="margin:18px auto 14px;max-width:760px">Найдите инвестора для стартапа за 5 минут</h1><p class="mu" style="max-width:520px;margin:auto">Опубликуйте проект, покажите его инвесторам и следите за просмотрами, заявками и ходом сбора средств в одном кабинете.</p>
<p style="margin-top:22px"><a class="btn p" href="#/cabinet/new">Опубликовать проект</a> <span class="mu" style="margin:0 8px">или</span> <a class="btn" href="#/startups">Смотреть стартапы</a></p>
<div class="card" style="margin:44px auto 0;text-align:left;padding:22px"><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${tile('Привлечено','$162 500')}${tile('Просмотры','2 140')}${tile('Новые заявки','18')}${tile('Цель сбора','65%')}</div><div style="margin-top:16px">${line([3,8,6,14,11,20,26])}</div></div></section>
<section class="band c"><div class="w"><p class="mu">На платформе уже ${D.projects.length} проектов</p><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px 32px;margin-top:14px;font-size:19px;font-weight:700;letter-spacing:-.02em">${D.projects.slice(0,6).map(p=>`<a href="#/p/${p.id}">${E(p.t)}</a>`).join('')}</div></div></section>
<section class="sec w c"><h2>Как Investly поможет вашему проекту</h2><p class="mu" style="margin:10px auto 32px;max-width:520px">Получайте внимание инвесторов и держите весь процесс под контролем.</p><div class="g" style="text-align:left">${[['5 минут','Публикация проекта','Заполните проблему, решение, команду и цель сбора — страница проекта готова сразу.'],['24/7','Проект виден инвесторам','Инвесторы находят стартап в каталоге и отправляют заявку на инвестицию.'],['Онлайн','Статистика в кабинете','Просмотры, заявки и прогресс сбора обновляются после каждого действия.']].map(x=>`<div class="card"><small class="mu">${x[0]}</small><h3 style="margin:6px 0">${x[1]}</h3><p class="mu" style="font-size:14px">${x[2]}</p></div>`).join('')}</div></section>
<section class="band"><div class="w"><h2 class="c" style="margin-bottom:28px">Как это работает</h2><div class="g">${['Создайте аккаунт как стартап или инвестор.','Опубликуйте проект со всеми деталями.','Принимайте заявки и следите за статистикой.'].map((x,i)=>`<div class="card"><b style="color:var(--bl)">Шаг ${i+1}</b><p style="margin-top:6px">${x}</p></div>`).join('')}</div></div></section>
<section class="sec w"><h2 class="c" style="margin-bottom:28px">Актуальные проекты</h2><div class="g">${D.projects.slice(0,3).map(card).join('')}</div></section>
<section style="background:var(--bl);color:#fff;padding:64px 20px;text-align:center"><h2 style="max-width:640px;margin:auto">Готовы показать свой стартап инвесторам? Опубликуйте его прямо сейчас</h2><p style="margin-top:22px"><a class="btn d" href="#/cabinet/new">Опубликовать проект</a></p></section>
<footer class="w mu" style="padding:28px 20px;font-size:13px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between"><span class="lg" style="color:var(--ink)">Investly</span><span>Демо: аккаунты и проекты хранятся в вашем браузере</span></footer>`;
V.startups=()=>`<section class="w sec"><h2>Стартапы</h2><div style="display:flex;gap:10px;margin:18px 0"><input id="q" placeholder="Поиск по названию" oninput="fl()"><select id="k" onchange="fl()" style="max-width:200px"><option value="">Все категории</option>${CAT.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="gr" class="g"></div></section>`;
function fl(){const q=$('#q').value.toLowerCase(),k=$('#k').value,a=D.projects.filter(p=>(!k||p.c==k)&&p.t.toLowerCase().includes(q));$('#gr').innerHTML=a.map(card).join('')||'<p class="mu">Ничего не найдено</p>'}
const seen=new Set();
V.p=id=>{const p=D.projects.find(x=>x.id==id);if(!p)return'<section class="w sec"><h2>Проект не найден</h2></section>';
if(!seen.has(id)){seen.add(id);p.v.push(Date.now());save()}
const vd=/^https?:\/\//.test(p.vd||'');
return`<section class="w sec pg"><div><span class="pill">${E(p.c)}</span><h1 style="font-size:clamp(28px,5vw,42px);margin:12px 0 20px">${E(p.t)}</h1>
${vd?`<a class="vid" href="${E(p.vd)}" target="_blank" rel="noopener">▶ Смотреть питч<br>${E(p.s)}</a>`:`<div class="vid">${E(p.s)}</div>`}
<h3 style="margin:28px 0 6px">Проблема</h3><p>${E(p.pr)}</p><h3 style="margin:24px 0 6px">Решение</h3><p>${E(p.so)}</p>
<h3 style="margin:24px 0 10px">Команда</h3><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${p.tm.map(t=>`<div class="card"><b>${E(t[0])}</b><div class="mu" style="font-size:14px">${E(t[1])}</div></div>`).join('')}</div></div>
<aside><div class="card" style="position:sticky;top:76px"><h3>Инвестиционная возможность</h3><p class="mu" style="font-size:14px;margin:8px 0 16px">Цель сбора: ${money(p.g)}</p><div class="bar"><i style="width:${pct(p)}%"></i></div><p style="margin:8px 0 18px"><b>${money(p.r)}</b> собрано (${pct(p)}%)</p><button class="btn p" style="width:100%" onclick="inv('${p.id}')">Инвестировать / запросить звонок</button></div></aside></section>`};
function inv(id){const u=me(),p=D.projects.find(x=>x.id==id);
if(!u){toast('Войдите как инвестор, чтобы отправить заявку');location.hash='#/auth/log';return}
if(u.ro!='inv'){toast('Заявки могут отправлять только инвесторы');return}
$('#md').innerHTML=`<div class="mod" onclick="if(event.target==this)cm()"><div class="card"><h3>Заявка на инвестицию</h3><p class="mu" style="font-size:14px">${E(p.t)}</p><label>Сумма, $</label><input id="am" type="number" min="1"><label>Сообщение (необязательно)</label><textarea id="ms" rows="3"></textarea><p style="margin-top:14px"><button class="btn p" onclick="snd('${id}')">Отправить заявку</button> <button class="btn" onclick="cm()">Отмена</button></p></div></div>`}
const cm=()=>$('#md').innerHTML='';
function snd(pid){const a=+$('#am').value;if(!(a>0))return toast('Укажите сумму');D.reqs.push({id:'r'+Date.now(),pid,iv:D.me,nm:me().nm,a,m:$('#ms').value,st:'new',ts:Date.now()});save();cm();toast('Заявка отправлена')}
V.auth=b=>{const reg=b!='log';return`<section class="w sec" style="max-width:440px"><h2>${reg?'Создать аккаунт':'Войти'}</h2><div class="card" style="margin-top:18px">${reg?`<label>Я</label><select id="ro"><option value="st">Стартап</option><option value="inv">Инвестор</option></select><label>Имя или компания</label><input id="nm">`:''}<label>Email</label><input id="em" type="email"><label>Пароль</label><input id="pw" type="password"><p id="er" style="color:#dc2626;font-size:13px;margin-top:8px"></p><button class="btn p" style="width:100%;margin-top:8px" onclick="auth(${reg})">${reg?'Создать аккаунт':'Войти'}</button></div><p class="mu" style="margin-top:14px;font-size:14px">${reg?'Уже есть аккаунт? <a href="#/auth/log" style="color:var(--bl)">Войти</a>':'Нет аккаунта? <a href="#/auth/reg" style="color:var(--bl)">Создать</a>'}</p></section>`};
function auth(reg){const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,er=m=>$('#er').textContent=m;
if(!em.includes('@')||pw.length<6)return er('Введите email и пароль от 6 символов');
if(reg){const nm=$('#nm').value.trim();if(!nm)return er('Укажите имя или компанию');if(D.users.some(u=>u.em==em))return er('Этот email уже зарегистрирован');
const u={id:'u'+Date.now(),nm,em,pw,ro:$('#ro').value};D.users.push(u);D.me=u.id}
else{const u=D.users.find(u=>u.em==em&&u.pw==pw);if(!u)return er('Неверный email или пароль');D.me=u.id}
save();location.hash='#/cabinet'}
const out=()=>{D.me=null;save();location.hash='#/'};
function resp(id,st){const r=D.reqs.find(x=>x.id==id);r.st=st;if(st=='ok')D.projects.find(p=>p.id==r.pid).r+=r.a;save();render()}
V.cabinet=t=>{const u=me();if(!u){toast('Войдите, чтобы открыть кабинет');location.hash='#/auth/log';return''}
const st=u.ro=='st',tabs=st?[['projects','Мои проекты'],['stats','Статистика'],['new','Опубликовать проект']]:[['reqs','Мои заявки']];t=tabs.some(x=>x[0]==t)?t:tabs[0][0];
const mine=D.projects.filter(p=>p.own==u.id),rq=D.reqs.filter(r=>st?mine.some(p=>p.id==r.pid):r.iv==u.id),pn=id=>E((D.projects.find(p=>p.id==id)||{}).t);
let m='';
if(t=='projects')m=mine.length?`<div class="g">${mine.map(card).join('')}</div>`:`<div class="card c" style="padding:40px"><h3>У вас пока нет проектов</h3><p class="mu" style="margin:6px 0 16px">Опубликуйте первый проект, чтобы его увидели инвесторы.</p><a class="btn p" href="#/cabinet/new">Опубликовать проект</a></div>`;
if(t=='stats'){const tr=mine.reduce((s,p)=>s+p.r,0),tg=mine.reduce((s,p)=>s+p.g,0),pc=tg?Math.min(100,Math.round(tr/tg*100)):0;
m=`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${tile('Привлечено',money(tr))}${tile('Просмотры',mine.reduce((s,p)=>s+p.v.length,0))}${tile('Новые заявки',rq.filter(r=>r.st=='new').length)}${tile('Доля цели',pc+'%')}</div>
<div class="pg" style="grid-template-columns:1fr 200px;margin-top:16px"><div class="card"><b>Просмотры за 7 дней</b><div style="margin-top:12px">${line(days(mine.flatMap(p=>p.v)))}</div></div><div class="card c"><b>Цель сбора</b><div style="margin-top:12px">${donut(pc)}</div></div></div>
<div class="card tbl" style="margin-top:16px"><b>Проекты</b><table><tr><th>Проект</th><th>Просмотры</th><th>Собрано</th><th>Заявки</th></tr>${mine.map(p=>`<tr><td><a href="#/p/${p.id}">${E(p.t)}</a></td><td>${p.v.length}</td><td>${money(p.r)} (${pct(p)}%)</td><td>${D.reqs.filter(r=>r.pid==p.id).length}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">Нет проектов</td></tr>'}</table></div>
<div class="card tbl" style="margin-top:16px"><b>Заявки инвесторов</b><table><tr><th>Инвестор</th><th>Проект</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr>${rq.map(r=>`<tr><td>${E(r.nm)}</td><td>${pn(r.pid)}</td><td>${money(r.a)}</td><td><span class="st">${ST[r.st]}</span></td><td>${r.st=='new'?`<button class="btn p" onclick="resp('${r.id}','ok')">Принять</button> <button class="btn" onclick="resp('${r.id}','no')">Отклонить</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Заявок пока нет</td></tr>'}</table></div>`}
if(t=='new')m=`<div class="card"><h3>Новый проект</h3><label>Название</label><input id="f1"><label>Категория</label><select id="f2">${CAT.map(c=>`<option>${c}</option>`).join('')}</select><label>Коротко о проекте</label><input id="f3" maxlength="120"><label>Проблема</label><textarea id="f4" rows="3"></textarea><label>Решение</label><textarea id="f5" rows="3"></textarea><label>Цель сбора, $</label><input id="f6" type="number" min="1"><label>Уже собрано, $</label><input id="f7" type="number" min="0" value="0"><label>Ссылка на питч-видео (необязательно)</label><input id="f8" placeholder="https://"><label>Команда: по человеку в строке, «Имя — роль»</label><textarea id="f9" rows="3"></textarea><p id="er" style="color:#dc2626;font-size:13px;margin-top:8px"></p><button class="btn p" style="margin-top:8px" onclick="pub()">Опубликовать проект</button></div>`;
if(t=='reqs')m=`<div class="card tbl"><b>Отправленные заявки</b><table><tr><th>Проект</th><th>Сумма</th><th>Статус</th></tr>${rq.map(r=>`<tr><td><a href="#/p/${r.pid}">${pn(r.pid)}</a></td><td>${money(r.a)}</td><td><span class="st">${ST[r.st]}</span></td></tr>`).join('')||'<tr><td colspan="3" class="mu">Вы ещё не отправляли заявок. <a href="#/startups" style="color:var(--bl)">Открыть каталог</a></td></tr>'}</table></div>`;
return`<section class="w cab"><div class="side"><p class="mu" style="font-size:13px;padding:0 12px 10px">${E(u.nm)}</p>${tabs.map(x=>`<a href="#/cabinet/${x[0]}" class="${x[0]==t?'on':''}">${x[1]}</a>`).join('')}</div><div>${m}</div></section>`};
function pub(){const f=i=>$('#f'+i).value.trim(),g=+f(6);if(!f(1)||!f(3)||!(g>0))return $('#er').textContent='Заполните название, описание и цель сбора';
const vd=f(8),id='p'+Date.now().toString(36);
D.projects.push({id,own:D.me,t:f(1),c:f(2),s:f(3),pr:f(4),so:f(5),g,r:Math.max(0,+f(7)||0),vd:/^https?:\/\//.test(vd)?vd:'',tm:f(9).split('\n').map(s=>s.split(/\s+[—-]\s+/)).filter(a=>a[0].trim()).map(a=>[a[0].trim(),(a[1]||'').trim()]),v:[]});
save();toast('Проект опубликован');location.hash='#/p/'+id}
function render(){const [,a='',b='']=location.hash.slice(1).split('/'),u=me();
$('#nv').innerHTML=`<div class="w"><a class="lg" href="#/">Investly</a><div class="m"><a href="#/startups">Стартапы</a><a href="#/cabinet">Личный кабинет</a></div><div class="r">${u?`<a class="btn p" href="#/cabinet">Кабинет</a><button class="btn" onclick="out()">Выйти</button>`:`<a href="#/auth/log">Войти</a><a class="btn p" href="#/auth/reg">Создать аккаунт</a>`}</div></div>`;
$('#app').innerHTML=a=='startups'?V.startups():a=='p'?V.p(b):a=='auth'?V.auth(b):a=='cabinet'?V.cabinet(b):V.home();
if(a=='startups')fl()}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
